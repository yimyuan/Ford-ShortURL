[build]
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "24"

[[edge_functions]]
  function = "backend-proxy"
  path = "/api/*"

[[edge_functions]]
  function = "backend-proxy"
  path = "/r/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
